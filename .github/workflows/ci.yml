name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build precedes the tests because tests/routes.test.ts asserts against
      # the prerendered HTML in .next/server/app.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check design token usage
        run: node scripts/check-token-usage.cjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Budgets are asserted against a real browser, which is the only place
      # LCP, CLS and colour contrast can actually be measured. tests/ covers
      # asset weight; this covers what the weight does to a page load.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/services
            http://localhost:3000/case-studies
          startServerCommand: npm start
          startServerReadyPattern: 'Ready in'
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
